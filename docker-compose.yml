version: '3.8'

services:
  xnexus:
    build: .
    ports:
      - "8080:8080"
    environment:
      - XNEXUS_ADDR=:8080
      - XNEXUS_BLOB_ROOT=/data/blobs
      - XNEXUS_AUTH_SECRET=production-secret-key
    volumes:
      - xnexus-data:/data/blobs
    restart: unless-stopped

  # Optional: Nginx for serving frontend and proxying to backend
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - xnexus
    restart: unless-stopped

volumes:
  xnexus-data:
